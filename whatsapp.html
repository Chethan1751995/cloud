<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | WhatsApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    .contact-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1rem;
      animation: fadeInUp 1s ease-out forwards;
      opacity: 0;
      transform: translateY(50px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .contact-card {
      background: white;
      border-radius: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      padding: 3rem;
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .contact-card h5 {
      color: #20C997;
      font-weight: 600;
    }

    .contact-card .btn-whatsapp {
      font-size: 1.2rem;
      padding: 0.75rem 2rem;
      border-radius: 50px;
      background-color: #25D366;
      border: none;
      color: white;
      transition: background 0.3s ease;
    }

    .contact-card .btn-whatsapp:hover {
      background-color: #1eb75a;
    }

    .contact-card i {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>

  <section id="contact-whatsapp" class="contact-wrapper">
    <div class="contact-card">
      <h5 class="mb-2">Contact Us</h5>
      <h2 class="fw-bold mb-3">Let's Chat on WhatsApp</h2>
      <p class="text-muted mb-4">
        Have a question or want to start a project? Connect with our team instantly on WhatsApp!
      </p>

      <a href="https://wa.me/919876543210" target="_blank" class="btn btn-whatsapp">
        <i class="fab fa-whatsapp"></i> Chat with Us
      </a>
    </div>
  </section>

</body>
</html>
